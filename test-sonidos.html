<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba de sonidos de jaque</title>
<style>
  body { background: #1a1a1a; color: #eee; font-family: sans-serif; padding: 30px; max-width: 520px; }
  h2 { color: #c9a227; margin-bottom: 6px; }
  p  { color: #888; font-size: 13px; margin-bottom: 24px; }
  .grupo { margin-bottom: 28px; }
  .grupo h3 { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; padding-bottom: 6px; }
  button {
    display: block; width: 100%; padding: 10px 16px; margin-bottom: 7px;
    background: #222; border: 1px solid #383838; border-radius: 8px;
    color: #ccc; font-size: 13px; cursor: pointer; text-align: left;
    transition: all .15s;
  }
  button:hover { border-color: #c9a227; color: #fff; background: #2a2500; }
  button.ok { border-color: #4caf50 !important; color: #4caf50 !important; background: #0d2b0d !important; }
  button.fail { border-color: #c0392b !important; color: #888 !important; }
</style>
</head>
<body>

<h2>Sonidos potentes de jaque ♚</h2>
<p>Probá los de abajo — están pensados para que se sientan fuertes. Decile a Claude cuál te gusta.</p>

<div class="grupo">
  <h3>💥 Potentes sintéticos</h3>
  <button onclick="runSynth(impacto1, this)">Impacto grave + ring</button>
  <button onclick="runSynth(impacto2, this)">Golpe metálico fuerte</button>
  <button onclick="runSynth(impacto3, this)">Thud + campana alta</button>
  <button onclick="runSynth(impacto4, this)">Explosión suave + tono</button>
  <button onclick="runSynth(impacto5, this)">Alarma corta</button>
  <button onclick="runSynth(impacto6, this)">Bajo profundo</button>
  <button onclick="runSynth(impacto7, this)">Drum hit + ping</button>
</div>

<div class="grupo">
  <h3>🎵 Combinados potentes (jugada + efecto)</h3>
  <button onclick="combo('standard','Move', impacto1, 0, this)">Jugada + Impacto grave</button>
  <button onclick="combo('standard','Move', impacto2, 0, this)">Jugada + Golpe metálico</button>
  <button onclick="combo('standard','Move', impacto3, 0, this)">Jugada + Thud + campana</button>
  <button onclick="combo('standard','Move', impacto7, 0, this)">Jugada + Drum + ping</button>
  <button onclick="combo('standard','Capture', impacto1, 0, this)">Captura + Impacto grave</button>
</div>

<div class="grupo">
  <h3>📌 Referencia</h3>
  <button onclick="play('standard','Move',this)">Jugada normal</button>
  <button onclick="play('standard','Capture',this)">Captura</button>
  <button onclick="play('futuristic','Check',this)">Futuristic · Check</button>
  <button onclick="play('piano','Check',this)">Piano · Check</button>
</div>

<script>
var ctx = null;
function getCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  return ctx;
}
var cache = {};
function loadUrl(url, cb, failCb) {
  if (cache[url]) { cb(cache[url]); return; }
  fetch(url)
    .then(function(r) { return r.arrayBuffer(); })
    .then(function(ab) { return getCtx().decodeAudioData(ab); })
    .then(function(buf) { cache[url] = buf; cb(buf); })
    .catch(failCb || function(){});
}
function playBuf(buf) {
  var src = getCtx().createBufferSource();
  src.buffer = buf; src.connect(getCtx().destination); src.start();
}
var BASE = 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/';
function play(theme, name, btn) {
  reset();
  var url = BASE + theme + '/' + name + '.mp3';
  loadUrl(url, function(buf) { playBuf(buf); btn.classList.add('ok'); },
    function() { btn.classList.add('fail'); btn.textContent += ' ❌'; });
}
function combo(theme, name, synthFn, delay, btn) {
  reset(); btn.classList.add('ok');
  var url = BASE + theme + '/' + name + '.mp3';
  loadUrl(url, function(buf) { playBuf(buf); setTimeout(synthFn, delay); });
}
function runSynth(fn, btn) { reset(); btn.classList.add('ok'); fn(); }
function reset() { document.querySelectorAll('button').forEach(function(b){ b.classList.remove('ok','fail'); }); }

// Impacto grave + ring agudo
function impacto1() {
  var c = getCtx(), t = c.currentTime;
  // Bajo
  var osc1 = c.createOscillator(), g1 = c.createGain();
  osc1.connect(g1); g1.connect(c.destination);
  osc1.type = 'sine'; osc1.frequency.setValueAtTime(120, t);
  osc1.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  g1.gain.setValueAtTime(0.7, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  osc1.start(t); osc1.stop(t + 0.3);
  // Ring agudo
  var osc2 = c.createOscillator(), g2 = c.createGain();
  osc2.connect(g2); g2.connect(c.destination);
  osc2.type = 'sine'; osc2.frequency.value = 1480;
  g2.gain.setValueAtTime(0.3, t + 0.02); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  osc2.start(t + 0.02); osc2.stop(t + 0.5);
}

// Golpe metálico fuerte
function impacto2() {
  var c = getCtx(), t = c.currentTime;
  var buf = c.createBuffer(1, Math.floor(c.sampleRate * 0.08), c.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/d.length, 1.5) * 0.9;
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 0.8;
  var g = c.createGain(); g.gain.setValueAtTime(1.2, t);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  // Tono metálico
  var osc = c.createOscillator(), g2 = c.createGain();
  osc.connect(g2); g2.connect(c.destination);
  osc.type = 'square'; osc.frequency.value = 440;
  g2.gain.setValueAtTime(0.15, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.start(t); osc.stop(t + 0.25);
}

// Thud grave + campana alta
function impacto3() {
  var c = getCtx(), t = c.currentTime;
  // Thud
  var osc = c.createOscillator(), g = c.createGain();
  osc.connect(g); g.connect(c.destination);
  osc.type = 'sine'; osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
  g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  osc.start(t); osc.stop(t + 0.2);
  // Campana
  [880, 1320, 1760].forEach(function(f, i) {
    var o2 = c.createOscillator(), g2 = c.createGain();
    o2.connect(g2); g2.connect(c.destination);
    o2.type = 'sine'; o2.frequency.value = f;
    g2.gain.setValueAtTime(0.2, t + i * 0.03); g2.gain.exponentialRampToValueAtTime(0.001, t + i * 0.03 + 0.4);
    o2.start(t + i * 0.03); o2.stop(t + i * 0.03 + 0.4);
  });
}

// Explosión suave + tono sostenido
function impacto4() {
  var c = getCtx(), t = c.currentTime;
  var buf = c.createBuffer(1, Math.floor(c.sampleRate * 0.1), c.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.3)) * 0.6;
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
  src.connect(f); f.connect(c.destination); src.start(t);
  var osc = c.createOscillator(), g = c.createGain();
  osc.connect(g); g.connect(c.destination);
  osc.type = 'triangle'; osc.frequency.value = 660;
  g.gain.setValueAtTime(0.0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  osc.start(t); osc.stop(t + 0.6);
}

// Alarma corta (dos notas descendentes)
function impacto5() {
  var c = getCtx(), t = c.currentTime;
  [[880, t], [660, t + 0.13]].forEach(function(pair) {
    var osc = c.createOscillator(), g = c.createGain();
    osc.connect(g); g.connect(c.destination);
    osc.type = 'sawtooth'; osc.frequency.value = pair[0];
    g.gain.setValueAtTime(0.25, pair[1]); g.gain.exponentialRampToValueAtTime(0.001, pair[1] + 0.12);
    osc.start(pair[1]); osc.stop(pair[1] + 0.12);
  });
}

// Bajo profundo
function impacto6() {
  var c = getCtx(), t = c.currentTime;
  var osc = c.createOscillator(), g = c.createGain();
  osc.connect(g); g.connect(c.destination);
  osc.type = 'sine'; osc.frequency.setValueAtTime(80, t);
  osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.start(t); osc.stop(t + 0.4);
  // Clic de ataque
  var buf = c.createBuffer(1, Math.floor(c.sampleRate * 0.02), c.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i/d.length) * 0.7;
  var src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination); src.start(t);
}

// Drum hit + ping
function impacto7() {
  var c = getCtx(), t = c.currentTime;
  // Kick drum
  var osc = c.createOscillator(), g = c.createGain();
  osc.connect(g); g.connect(c.destination);
  osc.type = 'sine'; osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
  g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  osc.start(t); osc.stop(t + 0.2);
  // Snare hit
  var buf = c.createBuffer(1, Math.floor(c.sampleRate * 0.05), c.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/d.length, 1.2) * 0.5;
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1000;
  src.connect(f); f.connect(c.destination); src.start(t);
  // Ping agudo
  var osc2 = c.createOscillator(), g2 = c.createGain();
  osc2.connect(g2); g2.connect(c.destination);
  osc2.type = 'sine'; osc2.frequency.value = 1760;
  g2.gain.setValueAtTime(0.25, t + 0.02); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc2.start(t + 0.02); osc2.stop(t + 0.4);
}
</script>
</body>
</html>
