# Worker de cuentas y proxys (cr-proxy). Desde el 23/10/2026 (auditoría 22/10, I13) se sube con:
#   cd ajedrez-argentino/cloudflare-worker
#   npx wrangler deploy          (wrangler viene con vivo-worker; ver COMO-DESPLEGAR.md)
# en vez de pegar el código en el panel: el freno de Cloudflare (FRENO_*) sólo se puede armar desde acá, el panel
# ni lo muestra. Si algún día se vuelve a pegar el código a mano, el Worker sigue andando con el freno de memoria.
# Las conexiones son las MISMAS que tenía en el panel: la base D1 "ajedrez" (DB) y Workers AI (AI). Las claves
# secretas (EDIT_PIN, GH_TOKEN, LICHESS_TOKEN, VIVO_SECRET) NO van acá ni se pierden al subir: viven en Cloudflare.
name = "cr-proxy"
main = "cr-proxy-worker.js"
compatibility_date = "2026-06-18"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "ajedrez"
database_id = "32eae1e8-4298-4b99-a9d4-166d0e92d857"

[ai]
binding = "AI"

# 🧱 Freno de Cloudflare (rlFreno): pedidos por minuto POR CENTRO DE DATOS, para cada clave ("limiss:<red>"…).
# Los números de namespace_id son de la cuenta: no reusarlos en otro Worker.
[[ratelimits]]
name = "FRENO_30"
namespace_id = "2230"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "FRENO_60"
namespace_id = "2260"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "FRENO_120"
namespace_id = "2320"
  [ratelimits.simple]
  limit = 120
  period = 60
