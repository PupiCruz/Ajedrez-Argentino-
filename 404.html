<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Ajedrez Argentino</title>
  <!-- Este archivo cumple DOS funciones:
       1) Le dice a Cloudflare Pages que responda 404 de verdad cuando un archivo
          no existe (sin este archivo, Pages devuelve el index.html entero con
          código 200 para CUALQUIER ruta inexistente → cada visita bajaba ~1 MB
          de más por los 3 embedded-*.js de autor que no se publican).
       2) Muestra una página amable si alguien escribe mal una dirección. -->
  <style>
    :root {
      --bg: #0a0a0a; --panel: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12);
      --text: #eee; --text2: #999; --gold: #ffc940;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f3ead4; --panel: rgba(255,255,255,0.6); --border: rgba(0,0,0,0.12);
              --text: #222; --text2: #666; --gold: #b07d0a; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      padding: 44px 36px; text-align: center; max-width: 420px; width: 100%;
    }
    .pieza { font-size: 64px; line-height: 1; }
    h1 { font-size: 44px; letter-spacing: 2px; margin: 10px 0 4px; color: var(--gold); }
    p  { font-size: 15px; color: var(--text2); line-height: 1.6; margin-bottom: 26px; }
    a.volver {
      display: inline-block; padding: 12px 26px; border-radius: 12px; text-decoration: none;
      background: rgba(255,201,64,0.14); border: 1px solid var(--gold); color: var(--gold);
      font-weight: 700; font-size: 15px;
    }
    a.volver:hover { background: rgba(255,201,64,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <div class="pieza">♞</div>
    <h1>404</h1>
    <p>Esta página no existe o la dirección está mal escrita.<br>
       Como un caballo en a1: acá no hay nada para hacer.</p>
    <a class="volver" href="/">← Volver al inicio</a>
  </div>
</body>
</html>
